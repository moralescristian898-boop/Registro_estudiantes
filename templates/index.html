{% extends "base.html" %}

{% block titulo %}Registrar Estudiante{% endblock %}

{% block contenido %}
<h2>Nuevo estudiante</h2>

<form action="{{ url_for('registrar') }}" method="POST" class="formulario">
   <div class="campo">
       <label for="nombre">Nombre completo:</label>
       <input type="text" id="nombre" name="nombre" required>
   </div>

   <div class="campo">
       <label for="edad">Edad:</label>
       <input type="number" id="edad" name="edad" min="0" max="120" required>
   </div>

   <div class="campo">
       <label for="correo">Correo electrónico:</label>
       <input type="email" id="correo" name="correo" required>
   </div>

   <div class="campo">
       <label for="programa">Programa:</label>
       <input type="text" id="programa" name="programa" required>
   </div>

   <button type="submit" class="boton">Guardar estudiante</button>
</form>
{% endblock %}
